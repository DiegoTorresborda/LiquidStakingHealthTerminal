[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paf-toolkit"
version = "0.1.0"
description = "PoS Adoption Funnel toolkit — calibrated against Ethereum benchmark"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "click>=8.1",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
paf = "paf.cli:cli"

[tool.setuptools.packages.find]
include = ["paf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
