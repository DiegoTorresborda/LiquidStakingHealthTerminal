      cex_pct: 0.0
      other_pct: 0.0
    as_of: 2026-05-18
    source: ""
    confidence: medium

# OPTIONAL — omit the entire l3 block if the network has no LSTs.
l3:
  lst_tvl_usd:
    value: 0.0
    as_of: 2026-05-18
