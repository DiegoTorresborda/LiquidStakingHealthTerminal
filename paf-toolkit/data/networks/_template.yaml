    confidence: high
  active_validators:
    value: 0
    as_of: 2026-05-18
    source: ""
    confidence: high
  distinct_operators:
    value: 0
    as_of: 2026-05-18
    source: ""
    confidence: medium
  nakamoto_coefficient:
    value: 0
    as_of: 2026-05-18
    source: ""
    confidence: medium
  nominal_yield_pct:
    value: 0.0
    as_of: 2026-05-18
    source: "Staking Rewards"
    confidence: high
  real_yield_pct:
    value: 0.0
    as_of: 2026-05-18
    source: "nominal_yield − net_issuance"
    confidence: medium
  slashing_events_cumulative:
    value: 0
    as_of: 2026-05-18
    source: ""
    confidence: medium
  eth_slashed_cumulative:
    value: 0.0
    as_of: 2026-05-18
    source: ""
    confidence: medium
  unbonding_period_days:
    value: 0.0
    as_of: 2026-05-18
    source: "Protocol docs"
    confidence: high
  min_stake_native:
    value: 0.0
    as_of: 2026-05-18
    source: "Protocol docs"
    confidence: high
  client_diversity_hhi:
