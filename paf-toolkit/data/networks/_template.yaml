# PAF network profile template — copy to data/networks/<ticker>.yaml and fill in.
#
# Required KPI envelope:
#   value:       the metric (number / bool / SourceBreakdown object)
#   as_of:       YYYY-MM-DD date the value was observed
#   source:      free-text citation (DefiLlama snapshot, Dune query URL, etc.)
#   confidence:  high | medium | low | data_gap | contested
#
# Layers L3, L4.1, L4.2 are OPTIONAL — omit them entirely for networks that
# haven't reached those stages. Use `native_liquid_staking_flag: true` for
# networks where staked positions are inherently liquid (e.g., Solana, Cardano);
# the toolkit will classify these as S_STAR and skip the L3 evaluation.

name: ExampleNet
ticker: EXN
genesis_date: 2023-01-01
consensus_type: pos           # pos | dpos | npos | lpos | bft_pos | other
native_liquid_staking_flag: false

l1:
  circulating_supply:
    value: 0.0
    as_of: 2026-05-18
    source: "CoinGecko / official explorer"
    confidence: high
  native_price_usd:
    # All dependent USD KPIs (market_cap_usd, lst_tvl_usd, lst_in_defi_tvl_usd,
    # restaking_tvl_usd) must be internally consistent with this price.
    # Run `paf.derive.consistency_report(profile)` to check.
    value: 0.0
    as_of: 2026-05-18
    source: "CoinGecko spot"
    confidence: high
  market_cap_usd:
    # Should equal circulating_supply × native_price_usd
    value: 0.0
    as_of: 2026-05-18
    source: "Derived"
    confidence: high
  net_issuance_annualized_pct:
    value: 0.0
    as_of: 2026-05-18
    source: ""
    confidence: medium
  holder_count:
    value: 0
    as_of: 2026-05-18
    source: ""
    confidence: medium
  active_addresses_30d:
    value: 0
    as_of: 2026-05-18
    source: ""
    confidence: medium
  top100_concentration_ex_protocols_pct:
    value: 0.0
    as_of: 2026-05-18
    source: ""
    confidence: data_gap
  cex_dex_depth_2pct_usd:
    value: 0.0
    as_of: 2026-05-18
    source: ""
    confidence: low
  token_age_months:
    value: 0
    as_of: 2026-05-18
    source: "Computed from genesis_date"
    confidence: high

l2:
