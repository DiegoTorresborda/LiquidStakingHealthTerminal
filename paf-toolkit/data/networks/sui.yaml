# Sui (SUI) — PoS Adoption Funnel profile
# Sources: CoinGecko, Suiscan, DefiLlama, Everstake Sui H1 2025 report,
# Chainspect (Nakamoto), Sui Foundation docs.
# As-of: 2026-05-19
#
# Calibration note on staking_ratio: Sui has ~60% of max supply still locked
# (foundation/team/vesting). The Suiscan "total stake" of ~7.4B SUI includes
# locked-but-staking tokens. For PAF comparability with Ethereum we use stake
# of circulating tokens (~2.8B SUI = 70% of 4.005B circulating). The
# investable stake market — what's available for LST adoption — is the
# relevant denominator for liquidization rate.

