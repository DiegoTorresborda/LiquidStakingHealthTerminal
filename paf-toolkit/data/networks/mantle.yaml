# Mantle (MNT) — PoS Adoption Funnel profile
#
# ⚠️  FRAMEWORK FIT WARNING ⚠️
# Mantle is an Ethereum L2 (modular rollup), not a PoS L1. The PAF framework
# was calibrated for PoS L1s, which makes Mantle a degenerate case:
#   • MNT has staking (4–8% APY) but the sequencer is centralized — MNT
#     staking is "earn yield on rollup token", not "secure the chain".
#   • Mantle's notable LST is mETH — but mETH is an ETH-backed LST that
#     happens to be ISSUED on Mantle. mETH belongs in Ethereum's funnel,
#     not Mantle's. Per the benchmark doc: "Mantle is the only material
#     native-L2 LST issuer per user spec."
#   • There are no mature MNT-native LSTs (no stMNT, no mMNT).
#
# We profile MNT honestly (likely classifies as S1 — low staking + no LST
# market), and note mETH as a cross-asset feature. For mETH-specific BD,
# treat it as an Ethereum L4.2 integration rather than a Mantle funnel KPI.
#
# Sources: CoinMarketCap, Messari State of Mantle Q1 2025, DefiLlama,
# Stakingrewards.com, Mantle Docs.
# As-of: 2026-05-19

