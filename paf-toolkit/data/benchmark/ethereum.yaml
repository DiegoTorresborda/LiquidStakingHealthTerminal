# Snapshot = Q1 2026 figures. History = quarterly from Beacon Chain genesis.
#
# Confidence vocabulary:
#   high       — value comes directly from a primary source quoted in the doc
#   medium     — value is a documented mid-point of a published range
#   low        — value is an order-of-magnitude estimate
#   data_gap   — flagged in benchmark doc as not consistently published
#   contested  — flagged in benchmark doc as methodology-dependent
#
# All USD figures are at the as_of date and not price-adjusted.

